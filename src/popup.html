<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="styles.css"><title>Illustration Archive</title></head>
<body class="popup">
  <h1>Illustration Archive</h1>
  <div class="auto-save-summary"><strong data-i18n="recordContents">Record contents</strong><span id="record-mode" class="status-badge" data-i18n="metadataOnly">Metadata only</span></div>
  <p id="status" data-i18n="openArtworkPage">Open an artwork page.</p>
  <button id="save" class="primary" data-i18n="recordThisArtwork">Record this artwork</button>

  <script type="module" src="popup.js"></script>
</body>
</html>
