<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="styles.css"><title>Illustration Archive</title></head>
<body class="popup">
  <h1>Illustration Archive</h1>
  <div class="auto-save-summary"><strong>自動記録</strong><span id="auto-save-status" class="status-badge">オフ</span></div>
  <div class="auto-save-summary"><strong>記録内容</strong><span id="record-mode" class="status-badge">メタデータのみ</span></div>
  <p id="status">作品ページを開いてください。</p>
  <button id="save" class="primary">この作品を記録</button>
  <button id="archive">記録一覧を開く</button>
  <script type="module" src="popup.js"></script>
</body>
</html>
